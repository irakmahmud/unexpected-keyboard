[workspace]
members = [
    "crates/attendance-common",
    "crates/attendance-domain",
    "crates/attendance-database",
    "crates/attendance-auth",
    "crates/attendance-face",
    "crates/attendance-device",
    "crates/attendance-sync",
    "crates/attendance-bigquery",
    "crates/attendance-core",
    "crates/attendance-reporting",
    "crates/attendance-api",
    "crates/attendance-device-agent",
    "crates/attendance-cli",
    "crates/attendance-tests",
]
exclude = ["rust_deepFace"]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["macros", "multipart"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
sha2 = "0.10"
thiserror = "1.0"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
