name: Build Unexpected Flutter Keyboard APK and AAB

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Remote Cloud Build on GitHub Runner
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🐦 Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🧪 Run Automated Unit Tests
        run: flutter test

      - name: ⚡ Build Ultra-Light Split-ABI Release APKs (arm64 & arm32)
        run: |
          flutter build apk --release --split-per-abi --no-shrink --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/unexpected-keyboard-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/unexpected-keyboard-arm32.apk

      - name: 🚀 Build Universal Release APK
        run: |
          flutter build apk --release --no-shrink --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/unexpected-keyboard-release.apk

      - name: 📦 Build Release App Bundle (AAB)
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: 📤 Upload Ultra-Light arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: unexpected-keyboard-arm64-apk
          path: build/app/outputs/flutter-apk/unexpected-keyboard-arm64.apk
          retention-days: 30

      - name: 📤 Upload Universal Release APK
        uses: actions/upload-artifact@v4
        with:
          name: unexpected-keyboard-release-apk
          path: build/app/outputs/flutter-apk/unexpected-keyboard-release.apk
          retention-days: 30

      - name: 📤 Upload Release App Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: unexpected-keyboard-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
