[package]
name = "attendance-desktop"
version = "8.0.0"
edition = "2021"
description = "Smart Attendance System — Native Cross-Platform Rust Desktop Application (Windows, macOS, Linux)"

[[bin]]
name = "attendance-desktop"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
