version: 2.1

executors:
  flutter-android-executor:
    docker:
      - image: ghcr.io/cirruslabs/flutter:stable
    working_directory: ~/keyboard
    resource_class: medium+
    environment:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dkotlin.compiler.execution.strategy=in-process"

jobs:
  validate-and-test:
    executor: flutter-android-executor
    steps:
      - checkout
      - restore_cache:
          name: 📦 Restore Pub Dependencies Cache
          keys:
            - v1-pub-cache-{{ checksum "pubspec.yaml" }}
            - v1-pub-cache-
      - run:
          name: 🔍 Verify Flutter Environment
          command: |
            flutter --version
            flutter doctor -v
      - run:
          name: 📥 Install Dependencies
          command: flutter pub get
      - save_cache:
          name: 💾 Save Pub Dependencies Cache
          key: v1-pub-cache-{{ checksum "pubspec.yaml" }}
          paths:
            - /root/.pub-cache
      - run:
          name: 🧪 Run Automated Unit & Logic Tests
          command: flutter test --no-pub

  build-remote-artifacts:
    executor: flutter-android-executor
    steps:
      - checkout
      - restore_cache:
          name: 📦 Restore Pub Dependencies Cache
          keys:
            - v1-pub-cache-{{ checksum "pubspec.yaml" }}
            - v1-pub-cache-
      - restore_cache:
          name: ⚡ Restore Gradle Cache
          keys:
            - v2-gradle-cache-{{ checksum "android/build.gradle" }}-{{ checksum "android/app/build.gradle" }}-{{ checksum "android/gradle.properties" }}
            - v2-gradle-cache-
      - run:
          name: 🛠️ Pre-install Required Android SDK & NDK Packages
          command: |
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
            sdkmanager "platforms;android-35" "build-tools;34.0.0" "cmake;3.22.1" "ndk;28.2.13676358"
      - run:
          name: 📥 Fetch Flutter Dependencies
          command: flutter pub get
      - run:
          name: ⚡ Compile Ultra-Light Split-ABI Release APKs (arm64 & arm32)
          command: |
            flutter build apk --release --split-per-abi --no-shrink --android-skip-build-dependency-validation
            mkdir -p /tmp/keyboard-apks
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk /tmp/keyboard-apks/unexpected-keyboard-arm64.apk
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk /tmp/keyboard-apks/unexpected-keyboard-arm32.apk
      - run:
          name: 🚀 Compile Universal Release APK
          command: |
            flutter build apk --release --no-shrink --android-skip-build-dependency-validation
            cp build/app/outputs/flutter-apk/app-release.apk /tmp/keyboard-apks/unexpected-keyboard-release.apk
      - run:
          name: 📦 Compile Remote Release App Bundle (AAB)
          command: flutter build appbundle --release --android-skip-build-dependency-validation
      - save_cache:
          name: 💾 Save Gradle Cache
          key: v2-gradle-cache-{{ checksum "android/build.gradle" }}-{{ checksum "android/app/build.gradle" }}-{{ checksum "android/gradle.properties" }}
          paths:
            - /root/.gradle/caches
            - /root/.gradle/wrapper
      - save_cache:
          name: 💾 Save Pub Dependencies Cache
          key: v1-pub-cache-{{ checksum "pubspec.yaml" }}
          paths:
            - /root/.pub-cache
      - run:
          name: 🔒 Package Artifacts & Generate SHA-256 Checksums
          command: |
            mkdir -p /tmp/keyboard-apks /tmp/keyboard-bundle
            cp build/app/outputs/bundle/release/app-release.aab /tmp/keyboard-bundle/unexpected-keyboard-release.aab
            cd /tmp/keyboard-apks && ls -lh *.apk && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt
            cd /tmp/keyboard-bundle && sha256sum *.aab > SHA256SUMS.txt && cat SHA256SUMS.txt
      - store_artifacts:
          path: /tmp/keyboard-apks
          destination: keyboard-apks
      - store_artifacts:
          path: /tmp/keyboard-bundle
          destination: keyboard-bundle

workflows:
  version: 2
  remote-flutter-compilation:
    jobs:
      - validate-and-test
      - build-remote-artifacts:
          requires:
            - validate-and-test

