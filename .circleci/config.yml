version: 2.1

# ==============================================================================
# CircleCI Remote Compilation Pipeline: Attendance System Rust Architecture
# Mandate: ZERO LOCAL RUST BUILD on Oracle VM. All heavy compilation occurs here.
# ==============================================================================

executors:
  rust-executor:
    docker:
      - image: cimg/rust:1.80.0
      - image: cimg/postgres:16.2
        environment:
          POSTGRES_USER: postgres
          POSTGRES_DB: attendance_pg_test
          POSTGRES_HOST_AUTH_METHOD: trust
    resource_class: large
    environment:
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"

commands:
  install-system-dependencies:
    description: "Install required C/C++ libraries and build utilities"
    steps:
      - run:
          name: "Install build dependencies & verify Rust toolchain"
          command: |
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              pkg-config \
              libssl-dev \
              cmake \
              libsqlite3-dev \
              postgresql-client \
              ca-certificates \
              curl \
              jq \
              file
            rustup update stable
            rustup default stable
            rustc --version
            cargo --version

  restore-cargo-cache:
    description: "Restore cached cargo registries and compilation targets"
    steps:
      - restore_cache:
          name: "Restore Cargo & Target Cache"
          keys:
            - v4-cargo-cache-{{ arch }}-{{ checksum "Cargo.lock" }}-{{ checksum "Cargo.toml" }}
            - v3-cargo-cache-{{ arch }}-{{ checksum "Cargo.lock" }}-{{ checksum "Cargo.toml" }}
            - v3-cargo-cache-{{ arch }}-

  save-cargo-cache:
    description: "Cache cargo dependencies and build objects to accelerate future runs"
    steps:
      - save_cache:
          name: "Save Cargo & Target Cache"
          when: always
          key: v4-cargo-cache-{{ arch }}-{{ checksum "Cargo.lock" }}-{{ checksum "Cargo.toml" }}
          paths:
            - ~/.cargo/registry/index
            - ~/.cargo/registry/cache
            - ~/.cargo/git/db
            - target

jobs:
  build-release-artifacts:
    executor: rust-executor
    steps:
      - checkout
      - install-system-dependencies
      - restore-cargo-cache
      - run:
          name: "Remote Cargo Build Release (Heavy Compilation)"
          command: |
            echo "=========================================================="
            echo "Starting Remote Release Compilation on CircleCI Runner..."
            echo "Target: x86_64-unknown-linux-gnu (Oracle Linux 9.8 Compatible)"
            echo "Oracle VM remains completely free of local build load."
            echo "=========================================================="
            cargo build --release --workspace
      - run:
          name: "Execute Unit, 64-Shard Scale & PostgreSQL 16 Partition Migration Tests"
          command: |
            mkdir -p dist
            cargo test --release --workspace -- --nocapture | tee dist/SCALE_AND_POSTGRES_VERIFICATION.txt
            chmod +x scripts/verify_postgres16_partitioning.sh
            ./scripts/verify_postgres16_partitioning.sh
      - save-cargo-cache
      - run:
          name: "Package Release Binaries & Checksums"
          command: |
            mkdir -p dist
            cp target/release/attendance-api dist/
            cp target/release/attendance-admin dist/attendance-cli
            cp target/release/attendance-device-agent dist/

            # Verify Target ELF Architecture
            file dist/attendance-api

            # Generate SHA256 Checksums
            cd dist
            sha256sum attendance-api attendance-cli attendance-device-agent > SHA256SUMS.txt
            cat SHA256SUMS.txt

            # Create distribution archive
            tar -czvf attendance-system-linux-x86_64.tar.gz attendance-api attendance-cli attendance-device-agent SHA256SUMS.txt
            ls -lh
      - store_artifacts:
          path: dist
          destination: release-binaries

workflows:
  version: 2
  remote-rust-compilation:
    jobs:
      - build-release-artifacts:
          filters:
            branches:
              only: /.*/
